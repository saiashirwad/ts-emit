name: Verify library contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [20261015, 42]
    env:
      FC_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y clang lua5.4 swi-prolog-nox
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
